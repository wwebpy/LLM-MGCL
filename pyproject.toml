[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mgcl"
version = "1.0.0"
description = "POI recommendation with LLM-augmented multi-graph learning and contrastive alignment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.1", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "statsmodels>=0.14", "sentence-transformers>=2.2", "huggingface_hub>=0.20", "fsspec>=2023.1",
  "pyyaml>=6.0", "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "networkx>=3", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
